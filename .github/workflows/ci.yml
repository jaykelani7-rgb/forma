name: Forma checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npm run typecheck
      - name: Check companion integrations
        run: |
          npx tsc --project apps/vscode-extension/tsconfig.json --noEmit
          npm run companion:build
          npm run extension:build
          npm run browser:build
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:share-links
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-regression-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7
